
services:
  db:
    image: postgres:16.2
    restart: no
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    ports:
      - "5432:5432"

  selenium:
    image: selenium/standalone-chrome:136.0
    restart: unless-stopped
    hostname: selenium
    ports:
      - "4444:4444"

  rabbitmq:
    image: rabbitmq:4.2-management
    restart: no
    env_file:
      - ./.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  celery:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        USER_ID: ${UID}
        GID: ${GID}
    entrypoint: [""]
    command: celery -A config worker -l INFO
    volumes:
      - ./app/src:/code/app
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_started

  celery-crawler:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        USER_ID: ${UID}
        GID: ${GID}
    entrypoint: [""]
    command: celery -A config worker -Q crawler -l INFO
    volumes:
      - ./app/src:/code/app
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_started

  celery-beat:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        USER_ID: ${UID}
        GID: ${GID}
    entrypoint: [""]
    command: celery -A config beat -l INFO --schedule=/home/docker/celerybeat-schedule
    volumes:
      - ./app/src:/code/app
      - celerybeat_data:/home/docker
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_started

  flower:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        USER_ID: ${UID}
        GID: ${GID}
    entrypoint: [""]
    command: celery flower -A config --port=5555 --broker=${CELERY_BROKER_URL}
    ports:
      - "5555:5555"
    env_file:
      - ./.env
    depends_on:
      - backend
      - celery
      - celery-crawler
      - celery-beat
      - rabbitmq

  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      args:
        USER_ID: ${UID}
        GID: ${GID}
    command: [
      "/code/app/wait-for-it.sh", "db:5432", "--",
      "python", "/code/app/manage.py", "runserver", "0.0.0.0:8000", "--settings=config.settings.local"]
    restart: no
    volumes:
      - ./app/src:/code/app
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    depends_on:
      - db

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    restart: no
    volumes:
      - ./ui/src:/code/ui/src
      - ./ui/config:/code/ui/config
      - ./ui/public:/code/ui/public
      - ./ui/index.html:/code/ui/index.html
      - ./ui/vite.config.ts:/code/ui/vite.config.ts
      - ./ui/tailwind.config.js:/code/ui/tailwind.config.js
      - ./ui/postcss.config.js:/code/ui/postcss.config.js
      - ./ui/tsconfig.json:/code/ui/tsconfig.json
      - ./ui/vite-env.d.ts:/code/ui/vite-env.d.ts
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=
      - VITE_PROXY_TARGET=http://backend:8000

volumes:
  postgres_data:
  rabbitmq_data:
  celerybeat_data:
