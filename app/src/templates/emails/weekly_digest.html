<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; background-color: #f9f9f9;">
    <table border="0" cellpadding="0" cellspacing="0" width="100%"
        style="table-layout: fixed; background-color: #f9f9f9;">
        <tr>
            <td align="center">
                <table border="0" cellpadding="0" cellspacing="0" width="600" class="container"
                    style="width: 100%; max-width: 600px; background-color: #ffffff; font-family: sans-serif; color: #333;">

                    <tr>
                        <td style="padding: 20px; text-align: center;">
                            <h2 style="color: #2c3e50; margin: 0;">📚 本週新書快報</h2>
                        </td>
                    </tr>

                    {% for vol in volumes %}
                    <tr>
                        <td style="padding: 15px; border-bottom: 1px solid #eeeeee;">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    {% if vol.image_url %}
                                    <td width="115" valign="top">
                                        <img src="{{ vol.image_url }}" alt="{{ vol.title }}" width="100"
                                            style="width: 100px; height: auto; border-radius: 4px; display: block;">
                                    </td>
                                    {% endif %}

                                    <td valign="top" style="line-height: 1.5;">
                                        <div style="font-weight: bold; font-size: 18px; color: #333;">{{ vol.title }}
                                        </div>
                                        <div style="color: #666666; font-size: 14px; margin: 5px 0;">Vol. {{
                                            vol.volume_number }} ({{ vol.region }})</div>
                                        <div style="color: #999999; font-size: 12px;">發售日：{{ vol.release_date }}</div>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    {% endfor %}

                    <tr>
                        <td style="padding: 30px; text-align: center;">
                            <a href="{{ site_url }}"
                                style="display: inline-block; padding: 12px 24px; background-color: #3d89da; color: #ffffff; text-decoration: none; border-radius: 5px; font-weight: bold;">前往
                                ComicChase 查看更多</a>
                        </td>
                    </tr>

                    <tr>
                        <td style="padding: 20px; text-align: center; font-size: 12px; color: #999999;">
                            <p style="margin: 0 0 10px 0;">這封郵件是系統自動發送的。</p>
                            <a href="{{ site_url }}/accounts/unsubscribe/?token={{ unsubscribe_token }}"
                                style="color: #999999; text-decoration: underline;">取消訂閱</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
