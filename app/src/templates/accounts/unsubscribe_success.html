<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取消訂閱成功 - ComicChase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 16px;
        }

        .email {
            color: #667eea;
            font-weight: 600;
            word-break: break-all;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .success-box {
            background: #d4edda;
            border: 1px solid #28a745;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #155724;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .resubscribe-note {
            margin-top: 24px;
            font-size: 14px;
            color: #999;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>取消訂閱成功</h1>

        <div class="success-box">
            <p style="margin: 0;"><span class="email">{{ email }}</span><br> 已成功取消電子郵件通知。</p>
        </div>

        <p>您將不再收到 ComicChase 的漫畫新刊通知郵件。</p>

        <a href="https://comicchase.site" class="btn">返回 ComicChase</a>

        <p class="resubscribe-note">
            如果您想重新訂閱，<br>請登入後在「我的追蹤」頁面中開啟郵件通知。
        </p>
    </div>
</body>

</html>
