# Docker Compose file for testing GCR deployment locally
# This mimics Cloud Run environment as closely as possible

services:
  selenium:
    image: selenium/standalone-chrome:136.0
    restart: unless-stopped
    hostname: selenium
    ports:
      - "4444:4444"

  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: comicchase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gcr_test:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile.gcr
      args:
        USER_ID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8080:8080"
    env_file:
      - .env.gcr-test
    depends_on:
      - db

volumes:
  postgres_data_gcr_test:
