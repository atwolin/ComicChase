# Docker Compose file for testing GCR deployment locally
# This mimics Cloud Run environment as closely as possible

services:
  selenium:
    image: selenium/standalone-chrome:136.0
    restart: unless-stopped
    hostname: selenium
    ports:
      - "4444:4444"

  db:
    image: postgres:16.2
    environment:
      POSTGRES_DB: comicchase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_gcr_test:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile.gcr
      args:
        USER_ID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8080:8080"
    environment:
      # Cloud Run uses PORT=8080
      PORT: 8080
      # For local testing: provide DB_HOST to trigger wait-for-it.sh
      DB_HOST: db
      DB_PORT: 5432
      # Django settings module
      DJANGO_SETTINGS_MODULE: config.settings.gcr
      # APPLICATION_SETTINGS - simulating Cloud Run's Secret Manager
      # In production, this comes from Secret Manager
      # Format: multi-line string with KEY="VALUE" pairs (one per line)
      APPLICATION_SETTINGS: |
        DATABASE_URL="postgres://postgres:postgres@db:5432/comicchase"
        SECRET_KEY="test-secret-key-for-local-testing-only"
        DEBUG="True"
        GS_BUCKET_NAME=""
        DEFAULT_FROM_EMAIL="noreply@comicchase-test.local"
    depends_on:
      - db

volumes:
  postgres_data_gcr_test:
